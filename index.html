<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Favicon -->
    <link
      rel="icon"
      href="images/"
      type="image/x-icon"
      sizes="96x96"
    />
<!-- Stylesheet -->
 <link rel="stylesheet" href="./styles.css">
    <title>Simple Homepage - Alarado | devChallenges.io</title>

    <style>
      * {

        height: 100vh;
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);

      .author-info a {

      }

  <body>
    <main>
      <!-- Navbar -->
       <nav>
        <div class="nav-center">
          <div class="nav-logo">

          <ul class="nav-links">

            <li class="nav-link">Product</li>

        </div>
       </nav>
  </main>

    <!-- 
    About us

    Product
